name: Release

# Publishes a GitHub release with the CHANGELOG.md section of the version
# (prepared beforehand with .github/scripts/prepare-release.sh). Two ways:
#  - push a version tag (1.2.3, 1.2.3-rc.1...);
#  - or run this workflow manually (Actions tab, "Run workflow") with the
#    version: it creates the tag on master itself.
# Packagist picks the tag up through its GitHub hook.

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.2.0); its CHANGELOG.md section must exist on master'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && 'master' || github.ref }}

      - name: Check the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_VERSION"
            if ! [[ "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::Invalid version \"$tag\" (expected semver, e.g. 1.2.0)."; exit 1
            fi
            if git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
              echo "::error::Tag $tag already exists."; exit 1
            fi
          else
            tag="$GITHUB_REF_NAME"
            git merge-base --is-ancestor "$GITHUB_SHA" origin/master \
              || { echo "::error::Tag $tag is not on master."; exit 1; }
          fi
          .github/scripts/changelog-section.sh "$tag" > /dev/null
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl
          coverage: none
      - uses: ramsey/composer-install@v3
      - name: Run tests
        run: vendor/bin/phpunit

      - name: Create the tag
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "refs/tags/$TAG"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          .github/scripts/changelog-section.sh "$TAG" \
            | sed -E "s#\]\(([A-Za-z0-9_./-]+\.md)\)#](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${TAG}/\1)#g" \
            > notes.md
          printf '\nFull changelog: %s/%s/blob/%s/CHANGELOG.md\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$TAG" >> notes.md
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md $prerelease
          fi
