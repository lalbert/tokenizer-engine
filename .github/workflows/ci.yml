name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Coding standards & static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl
          coverage: none
      - uses: ramsey/composer-install@v3
      - run: composer cs
      - run: composer analyse

  tests:
    name: PHP ${{ matrix.php }}${{ matrix.intl == false && ' (without intl)' || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        intl: [true]
        include:
          - php: '8.4'
            intl: false
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ matrix.intl && 'mbstring, intl' || 'mbstring, :intl' }}
          coverage: ${{ matrix.php == '8.4' && matrix.intl && 'pcov' || 'none' }}
      - uses: ramsey/composer-install@v3
      - name: Run tests
        if: ${{ !(matrix.php == '8.4' && matrix.intl) }}
        run: vendor/bin/phpunit
      - name: Run tests with coverage
        if: ${{ matrix.php == '8.4' && matrix.intl }}
        run: vendor/bin/phpunit --coverage-text --coverage-clover build/clover.xml
