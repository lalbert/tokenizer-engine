name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Coding standards & static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl
          coverage: none
      - uses: ramsey/composer-install@v4
      - run: composer cs
      - run: composer analyse

  tests:
    name: PHP ${{ matrix.php }}${{ matrix.intl == false && ' (without intl)' || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        intl: [true]
        include:
          - php: '8.4'
            intl: false
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ matrix.intl && 'mbstring, intl' || 'mbstring, :intl' }}
          coverage: ${{ matrix.php == '8.4' && matrix.intl && 'pcov' || 'none' }}
      - uses: ramsey/composer-install@v4
      - name: Run tests
        if: ${{ !(matrix.php == '8.4' && matrix.intl) }}
        run: vendor/bin/phpunit
      - name: Run tests with coverage
        if: ${{ matrix.php == '8.4' && matrix.intl }}
        run: vendor/bin/phpunit --coverage-text --coverage-clover build/clover.xml

  mutation:
    name: Mutation testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl
          coverage: pcov
      - uses: ramsey/composer-install@v4
      # Infection needs PHP 8.3+, the library supports 8.2: installed here only.
      - name: Install Infection
        run: |
          composer config --no-plugins allow-plugins.infection/extension-installer true
          composer require --dev --no-interaction --no-progress infection/infection:^0.35
      - name: Run Infection
        run: vendor/bin/infection --threads=max --no-progress --show-mutations=0
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: infection-report
          path: build/infection*.log

  examples:
    name: Examples (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - database: SQLite
            dsn: ''
          - database: MySQL 8.4
            image: mysql:8.4
            dsn: 'mysql:host=127.0.0.1;port=3306;dbname=examples;charset=utf8mb4'
          - database: MariaDB 11.4
            image: mariadb:11.4
            dsn: 'mysql:host=127.0.0.1;port=3306;dbname=examples;charset=utf8mb4'
          - database: PostgreSQL 17
            image: postgres:17
            dsn: 'pgsql:host=127.0.0.1;port=5432;dbname=examples'
    services:
      database:
        # An empty image skips the service (SQLite).
        image: ${{ matrix.image }}
        env:
          MYSQL_DATABASE: examples
          MYSQL_USER: examples
          MYSQL_PASSWORD: examples
          MYSQL_ROOT_PASSWORD: root
          MARIADB_DATABASE: examples
          MARIADB_USER: examples
          MARIADB_PASSWORD: examples
          MARIADB_ROOT_PASSWORD: root
          POSTGRES_DB: examples
          POSTGRES_USER: examples
          POSTGRES_PASSWORD: examples
        ports:
          - 3306:3306
          - 5432:5432
    env:
      EXAMPLES_DSN: ${{ matrix.dsn }}
      EXAMPLES_DB_USER: examples
      EXAMPLES_DB_PASSWORD: examples
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_sqlite, pdo_mysql, pdo_pgsql
          coverage: none
      - uses: ramsey/composer-install@v4
      - name: Wait for the database
        if: matrix.dsn != ''
        run: |
          for i in $(seq 1 60); do
            php -r 'new PDO(getenv("EXAMPLES_DSN"), getenv("EXAMPLES_DB_USER"), getenv("EXAMPLES_DB_PASSWORD"));' 2>/dev/null && exit 0
            sleep 2
          done
          echo "Database not ready" && exit 1
      - name: Search with plain SQL
        run: |
          php examples/search-with-sql.php | tee search.txt
          grep -q '1. Apprendre le français à Montréal (score 4.31)' search.txt
          grep -q '<mark>écoles</mark>' search.txt
          grep -q 'Suggestions for "vieux qu": Le Vieux-Québec à pied' search.txt
      - name: Search again (tables are recreated)
        run: php examples/search-with-sql.php | diff search.txt -
      - name: RAG
        run: |
          php examples/rag.php | tee rag.txt
          grep -q '\[1\] Observer les baleines à Tadoussac' rag.txt

  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl
          coverage: none
      - uses: ramsey/composer-install@v4
      # Informative: timings depend on the runner, they are not compared.
      - run: composer bench

  parity:
    name: Elasticsearch ${{ matrix.elasticsearch }} parity
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        elasticsearch: ['8.19.23', '9.5.5']
    steps:
      - uses: actions/checkout@v7
      - name: Start Elasticsearch
        run: |
          docker build -q -t tokenizer-engine-es --build-arg ES_VERSION=${{ matrix.elasticsearch }} tests/Parity
          docker run -d --name es -p 9200:9200 \
            -e discovery.type=single-node -e xpack.security.enabled=false \
            -e cluster.routing.allocation.disk.threshold_enabled=false \
            -e ES_JAVA_OPTS="-Xms512m -Xmx512m" tokenizer-engine-es
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl
          coverage: none
      - uses: ramsey/composer-install@v4
      - name: Wait for Elasticsearch
        run: |
          for i in $(seq 1 60); do
            curl -sf 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' && exit 0
            sleep 2
          done
          docker logs es
          exit 1
      - name: Compare with Elasticsearch
        run: composer parity
        env:
          ELASTICSEARCH_URL: http://localhost:9200
          PARITY_REQUIRED: '1'
